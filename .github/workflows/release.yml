name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full version-commit SHA to retry
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Create or update version PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.18.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create or update Changesets version PR
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version: pnpm version:packages
          commit: 'chore: version Doxa packages'
          title: 'chore: version Doxa packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect:
    name: Select immutable release commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      should_publish: ${{ steps.release.outputs.should_publish }}
    steps:
      - name: Check out selected commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
          fetch-depth: 0
      - name: Select release candidate
        id: release
        run: node scripts/select-release-commit.mjs
        env:
          RELEASE_COMMIT_INPUT: ${{ inputs.commit }}

  publish:
    name: Publish immutable alpha candidate
    needs: detect
    if: needs.detect.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.detect.outputs.commit }}
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.18.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate and publish exact candidate
        run: pnpm release:publish
        env:
          DOXA_RELEASE_COMMIT: ${{ needs.detect.outputs.commit }}

  tag:
    name: Tag immutable alpha candidate
    needs: [detect, publish]
    if: needs.detect.outputs.should_publish == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.detect.outputs.commit }}
          fetch-depth: 0
      - name: Create or verify exact package tags
        run: node scripts/tag-release.mjs
        env:
          DOXA_RELEASE_COMMIT: ${{ needs.detect.outputs.commit }}
